[project]
name = "frau-agent"
version = "0.1.0"
description = "Local German conversation partner built on pydantic-ai"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.3",
    "pydantic-ai>=2.61.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
frau = "frau_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frau_agent"]
